version: 2
updates:
    # Maintain dependencies for GitHub Actions
    - package-ecosystem: 'github-actions'
      directories:
          - '/'
          - '/.github/actions/common-node-setup'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      target-branch: 'develop'
      labels:
          - 'gh actions dependencies'
      # an action joins the first group it matches
      groups:
          # the codeql sub-actions only work in matching versions, so always update them together
          github/codeql-action:
              patterns:
                  - 'github/codeql-action/*'
          # minor and patch updates of all other actions in one PR, major updates separately
          # (some actions only run on main or tags, so PR checks don't cover them)
          github-actions:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    # Maintain dependencies for yarn
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 3
      target-branch: 'develop'
      open-pull-requests-limit: 15
      labels:
          - 'npm dependencies'
      # a dependency joins the first group it matches
      groups:
          angular-cli/devkit:
              patterns:
                  - '@angular/cli'
                  - '@angular/build'
                  - '@angular-devkit/*'
          angular:
              patterns:
                  - '@angular/*'
              exclude-patterns:
                  - '@angular/cli'
                  - '@angular/build'
          angular-eslint:
              patterns:
                  - 'angular-eslint'
                  - '@angular-eslint/*'
          codemirror:
              patterns:
                  - 'codemirror'
                  - '@codemirror/*'
          fortawesome:
              patterns:
                  - '@fortawesome/*'
              exclude-patterns:
                  - '@fortawesome/angular-fontawesome'
          commitlint:
              patterns:
                  - '@commitlint/*'
          typescript-eslint:
              patterns:
                  - 'typescript-eslint'
                  - '@typescript-eslint/*'
          eslint:
              patterns:
                  - 'eslint'
                  - '@eslint/*'
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
          # remaining minor and patch updates of dev dependencies in one PR
          npm-dev-minor-patch:
              dependency-type: 'development'
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
          npm-security:
              applies-to: security-updates
              patterns:
                  - '*'
