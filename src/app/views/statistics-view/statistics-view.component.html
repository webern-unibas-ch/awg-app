@if (statisticsData(); as statisticsData) {
    <div class="awg-statistics-view">
        <div class="container-fluid">
            <div class="row">
                <div class="col">
                    <!-- Statistics Header -->
                    <div
                        class="awg-statistics-view-header awg-jumbotron mb-4 p-3 pt-4 text-center shadow border rounded-3">
                        <h1 class="h2">Edition Statistics</h1>
                        <p class="lead text-muted">
                            Overview of active edition complexes in the online edition of the Anton Webern Gesamtausgabe
                        </p>
                    </div>

                    <!-- Summary Cards -->
                    <awg-statistics-summary
                        [activeSeries]="statisticsData.activeSeries"
                        [activeSections]="statisticsData.activeSections"
                        [activeComplexes]="statisticsData.activeComplexes"
                        [totalComplexes]="statisticsData.totalComplexes">
                    </awg-statistics-summary>

                    <!-- Overall Progress -->
                    <awg-statistics-overall-progress
                        [progressRate]="statisticsData.progressRate"
                        [activeComplexes]="statisticsData.activeComplexes"
                        [totalComplexes]="statisticsData.totalComplexes">
                    </awg-statistics-overall-progress>

                    <!-- Complex Types Breakdown -->
                    <awg-statistics-complex-breakdown
                        [activeComplexBreakdown]="statisticsData.activeComplexBreakdown"
                        [complexBreakdown]="statisticsData.complexBreakdown"
                        [totalComplexes]="statisticsData.totalComplexes"></awg-statistics-complex-breakdown>

                    <!-- Series Breakdown -->
                    <awg-statistics-series-breakdown
                        [seriesBreakdown]="statisticsData.seriesBreakdown"></awg-statistics-series-breakdown>
                </div>
            </div>
        </div>
    </div>
} @else {
    <p>Keine Statistikdaten verfügbar.</p>
}
