<div class="awg-statistics-breakdown-badge-container" [class]="containerClasses">
    @if (!hideEmptyBadges || breakdown.opus > 0) {
        <span class="awg-statistics-breakdown-badge badge bg-primary me-1">Op: {{ breakdown.opus }}</span>
    }
    @if (!hideEmptyBadges || breakdown.mnr > 0) {
        <span class="awg-statistics-breakdown-badge badge bg-secondary me-1">M: {{ breakdown.mnr }}</span>
    }
    @if (!hideEmptyBadges || breakdown.mnrX > 0) {
        <span class="awg-statistics-breakdown-badge badge bg-info me-1">M*: {{ breakdown.mnrX }}</span>
    }
</div>
