@if (summaryCards().length > 0) {
    <div class="awg-statistics-summary-cards row mb-4">
        @for (card of summaryCards(); track card.title) {
            <div class="col-md-3 mb-3">
                <awg-statistics-summary-card
                    [title]="card.title"
                    [value]="card.value"
                    [icon]="card.icon"
                    [bgClass]="card.bgClass">
                </awg-statistics-summary-card>
            </div>
        }
    </div>
}
