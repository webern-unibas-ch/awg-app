<div class="row mb-4">
    <div class="col-md-6">
        <div class="awg-statisctics-distribution-card awg-statistics-card card h-100">
            <div class="card-header">
                <h4 class="card-title mb-0">Complex Types Distribution</h4>
            </div>
            <div class="card-body">
                @for (item of complexBreakdownItems; track item.key) {
                    <div class="mb-3">
                        <awg-statistics-progress-bar
                            [config]="getProgressBarConfig(item.key, 'absolute')"
                            [headerLabel]="item.baseLabel + ' Complexes'"
                            [showPercentageLabel]="false"
                            [customClasses]="item.colorClass"
                            [useCustomClassesOnly]="true">
                        </awg-statistics-progress-bar>
                    </div>
                }
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="awg-statistics-available-card awg-statistics-card card h-100">
            <div class="card-header">
                <h4 class="card-title mb-0">Available Complex Types</h4>
            </div>
            <div class="card-body">
                @for (item of complexBreakdownItems; track item.key) {
                    <div class="mb-3">
                        <awg-statistics-progress-bar
                            [config]="getProgressBarConfig(item.key, 'ratio')"
                            [headerLabel]="'Available ' + item.baseLabel + (item.key !== 'opus' ? 's' : '')"
                            [showPercentageLabel]="false">
                        </awg-statistics-progress-bar>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
