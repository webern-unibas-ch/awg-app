@for (composite of compositeComplexes(); track composite.complex.complexId.route) {
    @let label = isCompact() ? composite.complex.complexId.short : composite.complex.complexId.full;

    <p class="awg-edition-complex-part-of mb-0">
        Teil von:
        @if (composite.disabled) {
            <span [innerHTML]="label"></span>
        } @else {
            <a [routerLink]="[composite.complex.baseRoute]" [innerHTML]="label"></a>
        }
        (Nr. {{ composite.partNumber }})
    </p>
}
