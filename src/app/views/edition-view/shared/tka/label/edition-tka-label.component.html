@let type = labelType();
@let isSketchId = editionUtils.isSketchId(id());

@if (type === 'evaluation') {
    <span>{{ isSketchId ? 'Skizzenkommentar' : 'Quellenbewertung' }}</span>
} @else if (type === 'commentary') {
    <span>{{ isSketchId ? 'Textkritische Kommentare' : 'Textkritische Anmerkungen' }}</span>
}
