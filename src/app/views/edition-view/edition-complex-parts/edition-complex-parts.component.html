@let item = outlineComplexItem();

@if (item.parts || item.compositeComplexes) {
    <div class="awg-edition-complex-parts mt-3">
        @if (item.compositeComplexes; as compositeComplexes) {
            <awg-edition-complex-composites [compositeComplexes]="compositeComplexes" />
        }
        @if (item.parts; as parts) {
            <p class="mb-1">Enthält:</p>
            <awg-edition-complex-parts-list [parts]="parts" />
        }
    </div>
}
