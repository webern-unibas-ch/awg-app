<div ngbAccordion #sheetAcc [class.fullscreen]="isFullscreen()">
    <div ngbAccordionItem="awg-edition-sheet-view" [collapsed]="false">
        <div ngbAccordionHeader class="accordion-button awg-accordion-button-custom-header justify-content-between">
            <button ngbAccordionToggle class="btn btn-link text-start p-0">Edierte Notentexte</button>
            <div class="ms-auto">
                @if (!isFullscreen()) {
                    <awg-button-usage-hints snippetKey="HINT_EDITION_SHEETS" />
                }
                <awg-fullscreen-toggle [fsElement]="sheetAcc" />
            </div>
        </div>
        <div ngbAccordionCollapse>
            <div ngbAccordionBody>
                <ng-template>
                    @let sheet = selectedSvgSheet();
                    @let textcritics = selectedTextcritics();

                    <div class="row">
                        <div
                            class="awg-edition-sheet-facet-container mb-4"
                            [class]="isSheetFacetMinimized() ? 'col-auto' : 'col-12 col-lg-4 col-xl-3'">
                            <!-- svg sheet facet -->
                            <awg-edition-sheet-facet
                                [svgSheetsData]="svgSheetsData()"
                                [selectedSvgSheet]="sheet"
                                [(isMinimized)]="isSheetFacetMinimized" />
                        </div>

                        <div
                            class="awg-edition-sheet-viewer-container"
                            [class]="isSheetFacetMinimized() ? 'col' : 'col-12 col-lg-8 col-xl-9'">
                            <!-- svg sheet -->
                            @if (sheet) {
                                <awg-edition-sheet-viewer
                                    [selectedSvgSheet]="sheet"
                                    (browseSheetRequest)="browseSheetRequest.emit($event)"
                                    (selectLinkBoxRequest)="selectLinkBoxRequest.emit($event)"
                                    (selectTkkOverlaysRequest)="selectTkkOverlaysRequest.emit($event)" />
                            }

                            <!-- table for TkA -->
                            @if (sheet && textcritics) {
                                <awg-edition-sheet-footer
                                    [selectedTextcritics]="textcritics"
                                    [selectedTextcriticalCommentary]="selectedTextcriticalCommentary()"
                                    [showTkA]="showTkA()" />
                            }
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</div>
