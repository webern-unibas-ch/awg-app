<h6 class="card-title">
    {{ facetGroupLabel() }}:
    @if (facetGroupLabel() === 'Werkeditionen') {
        <awg-edition-disclaimer-workeditions />
    } @else if (!svgSheets().length) {
        <span>---</span>
    }
</h6>
@for (svgSheet of svgSheets(); track svgSheet.id) {
    <awg-edition-sheet-facet-item [svgSheet]="svgSheet" [selectedSheetId]="selectedSheetId()" />
}
