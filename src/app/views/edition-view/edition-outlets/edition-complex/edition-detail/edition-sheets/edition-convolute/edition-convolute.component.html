<div ngbAccordion>
    <div ngbAccordionItem="awg-convolute-view" [collapsed]="false">
        <div ngbAccordionHeader>
            <button ngbAccordionButton>Konvolutübersicht</button>
        </div>
        <div ngbAccordionCollapse>
            <div ngbAccordionBody>
                <ng-template>
                    @if (selectedConvolute; as convolute) {
                        @let fragmentId = 'source_' + convolute.convoluteId;
                        @let label = convolute.convoluteLabel;

                        <!-- convolute label -->
                        <div class="awg-convolute-label">
                            <p>
                                <a [routerLink]="['../report']" [fragment]="fragmentId">{{ label }}</a>
                            </p>
                        </div>

                        <!-- viewer for convolute folios -->
                        <awg-edition-folio-viewer
                            [selectedConvolute]="convolute"
                            [selectedSvgSheet]="selectedSvgSheet" />

                        <!-- convolute legend -->
                        <div class="awg-convolute-legend col-12">
                            Legende:&nbsp;
                            @for (legend of folioLegends; track legend.colorClass) {
                                <span [class]="legend.colorClass">
                                    <fa-icon [icon]="faSquare" />
                                    {{ legend.label }}
                                </span>
                            }
                        </div>
                    }
                </ng-template>
            </div>
        </div>
    </div>
</div>
