<!-- Edition Folios Viewer -->
@let folioList = folios();
@if (folioList.length) {
    <div class="container-fluid svgGrid">
        <div class="row svgRow">
            @for (folio of folioList; track folio.folioId) {
                <awg-edition-folios-viewer-svg
                    class="col-sm-6 col-lg-{{ colSize() }} svgCol"
                    [folio]="folio"
                    [selectedSheetId]="selectedSheetId()" />
            }
        </div>
    </div>
}
