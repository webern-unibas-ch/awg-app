@if (editionComplex(); as complex) {
    @let complexId = complex.complexId;
    @let sectionRoute = complex.pubStatement.labeledSectionRoute;

    <p class="awg-source-evaluation-placeholder p-5 border rounded-3">
        <small class="text-muted"
            >[Die Quellenbewertung zum Editionskomplex <span [innerHTML]="complexId.full"></span> erscheint im
            Zusammenhang der vollständigen Edition von <span [innerHTML]="complexId.short"></span> in
            {{ sectionRoute.label }}.]
        </small>
    </p>
}
