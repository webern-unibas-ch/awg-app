<div class="awg-source-desc-corrections">
    <p class="awg-source-desc-corrections-label no-para-margin">
        <span class="smallcaps">Korrekturen:</span>
        <awg-button-expand-all [(isOpen)]="openAllCorrectionDetails" />
    </p>
    @for (correction of corrections(); track correction.id) {
        <details
            class="awg-source-description-correction-details half-para-margin"
            [id]="correction.id"
            [open]="openAllCorrectionDetails()">
            <summary
                class="awg-source-description-correction-summary no-para-margin"
                [awgCompileHtml]="correction.label + ':'"></summary>
            <div class="p-3 border rounded-3">
                <awg-edition-tka-evaluations [evaluations]="correction.evaluations" />
                @if (correction.commentary.comments.length) {
                    <awg-edition-tka-table
                        [displayedCommentary]="correction.commentary"
                        [isCorrections]="true"
                        [isRowtable]="correction.rowtable ?? false" />
                }
            </div>
        </details>
    }
</div>
