<div class="awg-source-desc-contents">
    <p class="awg-source-desc-contents-label no-para-margin">
        <span class="smallcaps">Inhalt:</span>
        <awg-button-expand-all [isOpen]="contentsState.allOpen()" (isOpenChange)="contentsState.setAll($event)" />
    </p>

    @for (content of contents(); track $index) {
        @let hasItemOrDesc = content.item || content.itemDescription;
        @let hasFolios = content.folios?.length;

        @if (hasItemOrDesc) {
            <details
                #contentDetails
                class="awg-source-desc-content-details half-para-margin"
                [id]="$index"
                [open]="contentsState.isOpen($index)"
                (toggle)="contentsState.setOpen($index, contentDetails.open)">
                <!-- content.itemDescription -->
                <summary class="awg-source-desc-content-item-summary no-para-margin">
                    <awg-source-desc-content-item [content]="content" />
                </summary>

                <!-- content.folios -->
                @if (hasFolios) {
                    <awg-source-desc-content-grid [content]="content" />
                }
            </details>
        } @else if (hasFolios) {
            <awg-source-desc-content-grid [content]="content" />
        }
    }
</div>
