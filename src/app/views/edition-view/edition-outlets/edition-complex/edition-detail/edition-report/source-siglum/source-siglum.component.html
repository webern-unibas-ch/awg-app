@if (sourceData(); as source) {
    <span [class]="siglumContainerClass()">
        @if (isClickable()) {
            <a (click)="clicked.emit()" (keyup.enter)="clicked.emit()" role="link" tabindex="0">
                <ng-container *ngTemplateOutlet="siglumContent" />
            </a>
        } @else {
            <ng-container *ngTemplateOutlet="siglumContent" />
        }

        <ng-template #siglumContent>
            @if (hasMissingFlag()) {
                <span>[</span>
            }
            <span [class]="siglumClass()">{{ source.siglum }}</span>
            @if (source.siglumAddendum) {
                <span [class]="siglumAddendumClass()">
                    <sup>{{ source.siglumAddendum }}</sup>
                </span>
            }
            @if (hasMissingFlag()) {
                <span>]</span>
            }
        </ng-template>
    </span>
}
