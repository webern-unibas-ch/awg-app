<div class="awg-source-desc-corrections">
    <p class="awg-source-desc-corrections-label mb-0">
        <span class="smallcaps">Korrekturen:</span>
        <awg-button-expand-all [isOpen]="correctionsState.allOpen()" (isOpenChange)="correctionsState.setAll($event)" />
    </p>
    @for (correction of corrections(); track correction.id) {
        <details
            #correctionDetails
            class="awg-source-desc-correction-details half-para-margin"
            [id]="correction.id"
            [open]="correctionsState.isOpen(correction.id)"
            (toggle)="correctionsState.setOpen(correction.id, correctionDetails.open)">
            <summary
                class="awg-source-desc-correction-summary mb-0"
                [awgCompileHtml]="`${correction.label}:`"></summary>
            <div class="p-3 border rounded-3">
                <awg-edition-tka-evaluations [evaluations]="correction.evaluations" />
                @if (correction.commentary.comments.length) {
                    <awg-edition-tka-table
                        [displayedCommentary]="correction.commentary"
                        [isCorrections]="true"
                        [isRowtable]="correction.rowtable ?? false" />
                }
            </div>
        </details>
    }
</div>
