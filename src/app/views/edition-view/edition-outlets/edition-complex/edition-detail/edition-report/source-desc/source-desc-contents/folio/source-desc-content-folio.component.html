<span class="awg-source-desc-content-folio">
    <span class="awg-source-desc-content-folio-type"><span [awgAbbr]="isPage() ? 'S.' : 'Bl.'"></span>&nbsp;</span>

    @if (hasFolioSuffix()) {
        <span class="awg-source-desc-content-folio-number">
            {{ folioNumber() }}<sup class="awg-source-desc-content-folio-suffix">{{ folioSuffix() }}</sup>
        </span>
    } @else {
        <span class="awg-source-desc-content-folio-number">{{ folioNumber() }}</span>
    }
</span>
