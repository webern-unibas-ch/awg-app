<!-- Data: Triples, SPARQL query, result -->

@let isFullscreen = isFullscreenMode();

<div class="row awg-graph-visualizer" [class.is-fullscreen]="isFullscreen">
    <div [class]="isFullscreen ? 'col-4 col-lg-3 px-0 awg-fullscreen' : 'col-12'">
        <div [class.row]="!isFullscreen">
            <div [class]="isFullscreen ? '' : 'col-12 col-lg-6 py-0 pe-lg-0'">
                <!-- awg-graph-triples-editor -->
                <awg-triples-editor
                    [triples]="triples"
                    [isFullscreen]="isFullscreen"
                    (errorMessageRequest)="showToastMessage($event, 'error')"
                    (performQueryRequest)="performQuery()"
                    (resetTriplesRequest)="resetTriples()"
                    (updateTriplesRequest)="triples = $event" />
            </div>
            <div [class]="isFullscreen ? '' : 'col-12 col-lg-6 py-0 ps-lg-0'">
                <!-- awg-graph-sparql-editor -->
                <awg-sparql-editor
                    [queryList]="queryList"
                    [query]="query"
                    [isFullscreen]="isFullscreen"
                    (errorMessageRequest)="showToastMessage($event, 'error')"
                    (performQueryRequest)="performQuery()"
                    (resetQueryRequest)="resetQuery($event)"
                    (updateQueryStringRequest)="query.queryString = $event" />
            </div>
        </div>
    </div>
    <!-- Results -->
    <div [class]="isFullscreen ? 'col-8 col-lg-9 px-0 awg-fullscreen' : 'col-12'">
        @if (query.queryType === 'construct') {
            <awg-construct-results
                #queryConstructResultAcc
                [queryResult$]="$any(queryResult$)"
                [defaultForceGraphHeight]="isFullscreen ? 1000 : defaultForceGraphHeight"
                [isFullscreen]="isFullscreen"
                (clickedNodeRequest)="onGraphNodeClick($event)" />
        } @else if (query.queryType === 'select') {
            <awg-select-results
                [queryResult$]="$any(queryResult$)"
                [queryTime]="queryTime"
                [isFullscreen]="isFullscreen"
                (clickedTableRequest)="onTableNodeClick($event)" />
        } @else {
            <awg-unsupported-type-results [queryType]="query.queryType || ''" [isFullscreen]="isFullscreen" />
        }
    </div>
</div>

<awg-toast aria-live="polite" aria-atomic="true" />
