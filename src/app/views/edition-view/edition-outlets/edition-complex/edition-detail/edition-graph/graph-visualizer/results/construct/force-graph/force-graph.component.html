<div class="awg-force-graph-container" [style.height.px]="height">
    <div class="awg-force-graph-icon-bar">
        <!-- Slider -->
        <awg-slider-zoom
            class="awg-force-graph-slider-zoom float-start mb-3"
            [zoomConfig]="zoomConfig"
            [(zoomValue)]="zoomValue"
            (resetRequest)="onResetZoom()" />

        <!-- Limit -->
        @if (graphData; as graph) {
            <div
                class="btn-group awg-force-graph-node-limit-container float-end my-auto"
                ngbDropdown
                container="body"
                role="group"
                aria-label="Button group with nested dropdown for node limit">
                <button type="button" class="btn btn-sm btn-outline-info" disabled aria-disabled="true">
                    @if (limit < graph.tripleCount) {
                        <span>{{ limit }} von </span>
                    }
                    {{ graph.tripleCount }} Triples
                </button>
                <button
                    class="btn btn-sm btn-info dropdown-toggle-split"
                    ngbDropdownToggle
                    [disabled]="graph.tripleCount === 0"
                    aria-label="Toggle dropdown"></button>
                <div class="dropdown-menu" ngbDropdownMenu>
                    @for (limitValue of limitValues; track limitValue) {
                        @if (graph.tripleCount > limitValue) {
                            <button class="dropdown-item" (click)="onLimitValueChange(limitValue)">
                                <span>{{ limitValue }}</span>
                            </button>
                        }
                    }
                    <button class="dropdown-item" (click)="onLimitValueChange(graph.tripleCount)">
                        <span>Kein Limit</span>
                    </button>
                </div>
            </div>
        }
    </div>

    <!-- Graph -->
    @if (limitedGraphData; as graph) {
        <awg-force-graph-svg
            class="awg-force-graph-svg-container"
            [graphData]="graph"
            [zoomConfig]="zoomConfig"
            [(zoomValue)]="zoomValue"
            (clickedNodeRequest)="clickedNodeRequest.emit($event)" />
    }
</div>
