<div class="awg-force-graph-container" [style.height.px]="height">
    <div class="awg-force-graph-icon-bar">
        <!-- Slider -->
        <awg-slider-zoom
            class="awg-force-graph-slider-zoom float-start mb-3"
            [zoomConfig]="zoomConfig"
            [(zoomValue)]="zoomValue"
            (resetRequest)="onResetZoom()" />

        <!-- Limit -->
        @if (graphData; as graph) {
            <awg-force-graph-limit
                class="awg-force-graph-limit-container float-end my-auto"
                [tripleCount]="graph.tripleCount"
                [limit]="limit"
                (limitChange)="onLimitValueChange($event)" />
        }
    </div>

    <!-- Graph -->
    @if (limitedGraphData; as graph) {
        <awg-force-graph-svg
            class="awg-force-graph-svg-container"
            [graphData]="graph"
            [zoomConfig]="zoomConfig"
            [(zoomValue)]="zoomValue"
            (clickedNodeRequest)="clickedNodeRequest.emit($event)" />
    }
</div>
