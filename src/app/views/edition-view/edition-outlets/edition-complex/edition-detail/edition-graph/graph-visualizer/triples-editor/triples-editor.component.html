<div ngbAccordion>
    <div
        ngbAccordionItem="awg-graph-visualizer-triples"
        [collapsed]="isAccordionItemCollapsed()"
        [disabled]="isAccordionItemDisabled()">
        <div ngbAccordionHeader>
            <button ngbAccordionButton class="p-3">RDF Triples</button>
        </div>
        <div ngbAccordionCollapse [style.height]="isFullscreen ? '50vh' : 'auto'">
            <div ngbAccordionBody>
                <ng-template>
                    <!-- CodeMirror editor instance -->
                    <awg-codemirror
                        ngDefaultControl
                        [mode]="cmTurtleMode"
                        [(content)]="triples"
                        (contentChange)="onEditorInputChange($event)" />

                    <!-- Action buttons -->
                    <awg-editor-action-buttons
                        class="mt-2"
                        (queryRequest)="performQuery()"
                        (resetRequest)="resetTriples()"
                        (clearRequest)="onEditorInputChange('')" />
                </ng-template>
            </div>
        </div>
    </div>
</div>
