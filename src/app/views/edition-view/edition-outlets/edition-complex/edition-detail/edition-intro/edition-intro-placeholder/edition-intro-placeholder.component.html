@if (editionComplex(); as complex) {
    @let complexId = complex.complexId;
    @let sectionRoute = complex.pubStatement.labeledSectionRoute;

    <div class="awg-edition-intro-placeholder">
        <p class="text-muted small">
            [Die Einleitung zum Editionskomplex <span [innerHTML]="complexId.full"></span> erscheint im Zusammenhang der
            vollständigen Edition von <span [innerHTML]="complexId.short"></span> in {{ sectionRoute.label }}.]
        </p>
    </div>
}
