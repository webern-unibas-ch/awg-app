@let sectionRoute = editionComplex?.pubStatement?.labeledSectionRoute;

@if (sectionRoute) {
    <div class="p-3 border rounded-3 text-center awg-edition-intro-partial-disclaimer">
        <p class="no-para-margin text-muted">
            [Siehe auch die gesamte Einleitung zu
            <a [routerLink]="[sectionRoute.route.join('/'), introRoute]"
                ><span>{{ sectionRoute.label }}</span></a
            >.]
        </p>
    </div>
}
