@if (editionComplex(); as complex) {
    @let section = complex.pubStatement.labeledSectionRoute;
    @let sectionRoute = section.route.join('/');
    @let sectionLabel = section.label;

    <div class="p-3 border rounded-3 text-center awg-edition-intro-partial-disclaimer">
        <p class="no-para-margin text-muted">
            [Siehe auch die gesamte Einleitung zu
            <a [routerLink]="[sectionRoute, introRoute]"
                ><span>{{ sectionLabel }}</span></a
            >.]
        </p>
    </div>
}
