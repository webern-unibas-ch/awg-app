@if (selectedSeries(); as selectedSeries) {
    <div class="awg-edition-sections-grid row row-cols-1 row-cols-md-3 row-cols-xl-5 g-4">
        @for (section of selectedSeries.sections; track section.section.route) {
            <div class="col">
                <awg-edition-section-card [displayedSection]="section" />
            </div>
        }
    </div>
}
