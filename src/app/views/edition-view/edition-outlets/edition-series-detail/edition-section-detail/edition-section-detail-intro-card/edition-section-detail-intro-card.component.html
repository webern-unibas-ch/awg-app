@if (selectedSection(); as section) {
    @if (section.content.intro; as intro) {
        <div class="card awg-edition-card h-100">
            <h5 class="card-header">
                <span class="awg-edition-info-header-title" [innerHTML]="'Einleitung'"></span>
            </h5>
            <div class="card-body d-flex flex-column">
                <p class="card-text">{{ intro.preview }} …</p>
            </div>
            <div class="card-footer d-flex flex-column">
                <p class="mt-auto text-end">
                    @let sectionRoute = section.labeledRoute.route.join('/');
                    <a
                        [routerLink]="[sectionRoute, 'intro']"
                        class="btn btn-outline-info"
                        [class.disabled]="intro.disabled"
                        >Mehr ...
                    </a>
                </p>
            </div>
        </div>
    }
}
