<nav class="awg-edition-info-breadcrumb" aria-label="Navigationspfad">
    <ol class="breadcrumb">
        @for (item of items(); track $index) {
            <li class="breadcrumb-item" [class.active]="$last" [attr.aria-current]="$last ? 'page' : null">
                @if (!$first) {
                    <fa-icon class="awg-edition-breadcrumb-divider" [icon]="faChevronRight" />
                }
                @if (item.route.length) {
                    <a [routerLink]="item.route" [innerHTML]="item.label"></a>
                } @else {
                    <span [innerHTML]="item.label"></span>
                }
            </li>
        }
    </ol>
</nav>
