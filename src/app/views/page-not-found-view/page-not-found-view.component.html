<div class="awg-page-not-found-view p-5 border rounded-3">
    <awg-heading [id]="pageNotFoundViewId" [title]="pageNotFoundViewTitle" />

    <div class="awg-page-not-found-view-body text-center">
        <h5 id="awg-page-not-found-view-subtitle">{{ pageNotFoundViewSubtitle }}</h5>

        <div class="awg-page-not-found-view-image my-4">
            <img [src]="pageNotFoundViewImgPath" class="img-fluid rounded" alt="Page not found" />
        </div>

        <p id="awg-page-not-found-view-contact">
            Kontaktieren Sie uns gerne unter:
            <a [href]="awgContactUrl">anton-webern.ch</a>
        </p>

        <p id="awg-page-not-found-view-back" class="mt-4">
            Zurück zur Startseite: <a [routerLink]="['/home']" routerLinkActive="active">Home</a>
        </p>
    </div>
</div>
