@for (toast of toasts(); track toast) {
    <ngb-toast
        [header]="toast.options.header"
        [class]="toast.options.classname"
        [autohide]="true"
        [delay]="toast.options.delay || 5000"
        (hidden)="onHidden(toast)">
        @if (isTemplate(toast.textOrTpl)) {
            <ng-template [ngTemplateOutlet]="toast.textOrTpl" />
        } @else {
            {{ toast.textOrTpl }}
        }
    </ngb-toast>
}
