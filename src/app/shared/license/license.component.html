<div class="awg-license">
    <p class="small text-center">
        Die Online-Edition der AWG ist lizenziert unter einer
        <a class="awg-license-link" [href]="LICENSE_LINK" rel="license"
            >{{ LICENSE_TEXT }}
            <span class="awg-license-icon">
                @for (icon of LICENSE_ICONS; track icon.alt) {
                    <img [src]="icon.src" [alt]="icon.alt" />
                }</span></a
        >.
    </p>
</div>
