<div class="modal-header">
    <h5 class="modal-title" id="awg-modal-title">{{ modalData.title }}</h5>
    <button type="button" class="btn-close" aria-label="Close modal" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body text-center">
    @if (modalData.type === 'image') {
        <img [src]="modalData.content" [alt]="modalData.title" class="img-fluid" />
    } @else {
        <div [innerHTML]="modalData.content" class="text-start"></div>
    }
</div>
<div class="modal-footer">
    <button
        type="button"
        class="btn btn-outline-dark awg-modal-button"
        ngbAutofocus
        (click)="activeModal.close('Close click')">
        Schließen
    </button>
</div>
