<div class="awg-nav-link-group para d-flex justify-content-between" aria-label="Nav link group">
    @for (navLink of navLinks(); track $index) {
        <a
            class="awg-nav-link"
            [class.first]="$first"
            [class.last]="$last"
            [class.disabled]="navLink.disabled"
            [attr.aria-disabled]="navLink.disabled || null"
            [routerLink]="navLink.disabled ? null : [navLink.root, navLink.link]"
            [queryParamsHandling]="queryParamsHandling()"
            routerLinkActive="active"
            (awgClick)="selectNavLink(navLink)">
            {{ navLink.label | uppercase }}
        </a>
    }
</div>
