@if (isClickable()) {
    <a role="link" tabindex="0" (click)="clicked.emit()" (keyup.enter)="clicked.emit()">
        <ng-container [ngTemplateOutlet]="linkContent" />
    </a>
} @else {
    <ng-container [ngTemplateOutlet]="linkContent" />
}

<ng-template #linkContent>
    <ng-content />
</ng-template>
