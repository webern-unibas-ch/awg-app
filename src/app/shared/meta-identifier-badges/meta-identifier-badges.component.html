@for (idConfig of IDENTIFIER_CONFIGS; track idConfig.key) {
    @if (identifiers?.[idConfig.key]) {
        <a class="awg-meta-identifier-badge awg-logo-link" href="{{ idConfig.baseUrl }}{{ identifiers[idConfig.key] }}"
            ><img
                class="awg-meta-identifier-badge-icon"
                [src]="idConfig.src"
                [alt]="idConfig.label"
                title="{{ idConfig.key | uppercase }}: {{ identifiers[idConfig.key] }}"
        /></a>
    }
}
