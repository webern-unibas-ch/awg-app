<div class="input-group input-group-sm awg-slider-zoom-container">
    <span class="input-group-text awg-slider-zoom-label" aria-hidden="true">{{ zoomValue() }}x</span>
    <input
        #range
        type="range"
        class="awg-slider-zoom"
        aria-label="Zoom"
        [attr.aria-valuetext]="zoomValue() + 'x'"
        [min]="zoomConfig().min"
        [max]="zoomConfig().max"
        [step]="zoomConfig().stepSize"
        [value]="zoomValue()"
        (input)="zoomValue.set(+range.value)" />
    <button
        type="button"
        class="btn btn-sm btn-outline-info"
        title="Zoom zurücksetzen"
        aria-label="Zoom zurücksetzen"
        (click)="resetRequest.emit()">
        <fa-icon [icon]="faCompressArrowsAlt" />
    </button>
</div>
