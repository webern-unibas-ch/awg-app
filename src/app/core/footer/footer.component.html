<footer class="container-fluid text-center">
    <!-- main top footer -->
    <div class="row awg-footer-main mb-3">
        <div class="col-md-6">
            <awg-footer-declaration [pageMetaData]="pageMetaData" />
        </div>

        <div class="col-6 col-md-2 order-md-first m-auto">
            <awg-logo [logoData]="logosData.unibas" />
        </div>
        <div class="col-6 col-md-3 m-auto">
            <awg-logo [logoData]="logosData.sagw" />
            <awg-logo [logoData]="logosData.snf" />
        </div>
    </div>

    <!-- secondary bottom footer -->
    <div class="row awg-footer-secondary text-muted">
        <div class="col-6 col-sm-8 text-start">
            <awg-footer-copyright [pageMetaData]="pageMetaData" />
        </div>
        <div class="col-6 col-sm-4 text-end my-auto">
            <awg-footer-poweredby [logosData]="logosData" [pageMetaData]="pageMetaData" />
        </div>
        <div class="col-12 gtrans" id="google_translate_element"></div>
    </div>
</footer>
